[package]
name = "bottleship-lan"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace]
exclude = ["core", "native", "gateway", "transport"]

[dependencies]
bottleship-lan-core = { path = "core" }
bottleship-lan-native = { path = "native" }
bottleship-lan-gateway = { path = "gateway" }
bottleship-lan-transport = { path = "transport" }
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
