<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No user zoom: the canvas is the viewport, and a double-tap zoom would fight
         every tap the guest is meant to receive. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080d10" />
    <!-- iOS: "Add to Home Screen" launches standalone (no Safari chrome) — the only
         way to get a fullscreen-like experience on iPhone, which has no element
         Fullscreen API. black-translucent + viewport-fit=cover run edge-to-edge. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BottleShip" />
    <title>BottleShip</title>
    <link rel="icon" type="image/png" href="/bottleship_logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
