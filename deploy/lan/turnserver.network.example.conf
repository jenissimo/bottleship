# Use the public TURN hostname as the authentication realm.
realm=turn.example.org

# Set these to the IPv4 address assigned to the dedicated TURN host's interface.
listening-ip=192.0.2.10
relay-ip=192.0.2.10

# If behind one-to-one NAT, map the internet-facing IPv4 to the interface IPv4
# and preserve every UDP relay port across the mapping.
#external-ip=198.51.100.10/192.0.2.10
