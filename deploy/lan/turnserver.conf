listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49415
use-auth-secret
fingerprint
cert=/etc/bottleship/tls/fullchain.pem
pkey=/etc/bottleship/tls/privkey.pem
no-dtls

# Clients can reach TURN over TLS while allocations still relay UDP to peers.
no-tcp-relay
no-multicast-peers
no-cli
no-software-attribute
no-stun

# Cap allocations and bytes per second in each direction.
user-quota=12
total-quota=240
max-bps=128000
bps-capacity=16000000
relay-threads=2

# Do not offer relay access to private, local or special-use IPv4 networks.
# Coturn also blocks loopback peers unless allow-loopback-peers is enabled.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=168.63.129.16
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255

pidfile=/tmp/turnserver.pid
userdb=/var/lib/coturn/turndb
log-file=stdout
simple-log
