name: CI

on:
  push:
    # This repo's default branch is `main` and work lands on `develop`; there is no `master`,
    # so the push job used to never run.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate (bun run gate)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Pinned so a naga release cannot change what CI validates without a commit, and so the
      # cache key below is meaningful.
      NAGA_VERSION: "30.0.1"
    steps:
      - uses: actions/checkout@v7
        with:
          # vendor/v86 is a file: dependency of package.json — bun install needs
          # the submodule checked out even though the gate never builds it.
          submodules: true
          # NOT the default depth of 1. checkout passes fetch-depth straight through as
          # `git submodule update --depth=N`, and a shallow submodule fetch brings only the
          # submodule's DEFAULT branch (master); our gitlink lives on `bottleship`, so checkout
          # falls back to asking for the bare SHA and the server refuses it ("not our ref").
          # Full depth also gives validate-jit-exports the submodule history its staleness
          # check reads — shallow, that check finds no commits and passes vacuously.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache offline WGSL validator
        id: naga-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-${{ env.NAGA_VERSION }}-${{ runner.os }}

      - name: Install offline WGSL validator
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --locked --version ${{ env.NAGA_VERSION }}

      # THE canonical quality gate (CLAUDE.md §4) — the whole ordered list, not a subset.
      # Running the `gate` script rather than re-listing the steps is what keeps this file
      # from drifting away from the definition it claims to run; the gate itself sets
      # BS_REQUIRE_WGSL_VALIDATOR for the validator report and the test suite.
      - name: Quality gate
        run: bun run gate

  dedup-scan:
    name: Dedup / dead-export scan (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only — findings are triage input (release-triage §11.1), not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Same submodule contract as the gate job above.
          submodules: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Copy/paste detector (jscpd)
        run: >
          bunx jscpd src
          --min-tokens 120 --min-lines 10
          --reporters consoleFull
          --ignore "**/*.generated.ts,**/index.ts"
          --threshold 100

      - name: Dead exports (ts-prune)
        run: bunx ts-prune -p tsconfig.json || true
